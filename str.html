<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Store · bMarketX</title>
<meta name="description" content="A bMarketX store.">
<meta property="og:title" content="Store · bMarketX">
<meta property="og:description" content="A bMarketX store.">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta property="og:image" content="https://bmarketx.com/brand/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="store">
<main class="wrap" id="root"><div class="empty">Loading store…</div></main>
<script src="https://unpkg.com/@bwalletx/connect@0.5.0/dist/bwalletx-connect.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/app.js"></script>
<script src="/bwx.js"></script>
<script>
(async () => {
  const { esc, api, after, card, pager, params } = BMX;
  const handle = location.pathname.split('/')[2] || params.get('handle') || '';
  const page = +params.get('page') || 1, sort = params.get('sort') || 'best', sq = params.get('sq') || '';
  try {
    const j = await api(`/api/store?handle=${encodeURIComponent(handle)}&page=${page}&sort=${sort}&q=${encodeURIComponent(sq)}`);
    const s = j.store;
    document.title = `${s.display_name} | bMarketX`;
    const link = (o) => { const u = new URLSearchParams({ page, sort, sq, ...o }); return `/str/${s.handle}?${u}`; };
    root.innerHTML = `
      <section class="sthead">
        ${s.logo ? `<img class="av" src="${esc(s.logo)}" alt="">` : '<div class="av"></div>'}
        <div>
          <h1>${esc(s.display_name)}</h1>
          <div class="stats">
            ${s.ebay_feedback ? `<span><b>${esc(s.ebay_feedback)}</b> positive feedback</span>` : ''}
            ${s.ebay_sold ? `<span><b>${esc(s.ebay_sold)}</b> items sold</span>` : ''}
            ${s.ebay_followers ? `<span><b>${esc(s.ebay_followers)}</b> followers</span>` : ''}
          </div>
          <div class="muted" style="font-size:12px;margin-top:4px">${s.ebay_name ? '✓ Verified eBay seller · feedback carried over from eBay' : 'Not yet verified · moved from an eBay listings file'}</div>
        </div>
        <div class="act"><button class="btn ghost" type="button" data-share>Share</button><button class="btn ghost" type="button" data-soon2>Contact</button><button class="btn" type="button" data-soon2>♡ Save Seller</button></div>
      </section>
      <nav class="tabs"><a class="on" href="/str/${s.handle}">Shop</a><a href="#about">About</a><a href="#" data-soon2>Feedback</a></nav>
      <form class="tools" action="/str/${s.handle}">
        <div class="field" style="margin:0;flex:1;max-width:380px"><input name="sq" value="${esc(sq)}" placeholder="Search all ${j.total.toLocaleString()} items"></div>
        <label class="pill">Sort: <select name="sort" onchange="this.form.submit()">
          ${[['best', 'Best Match'], ['low', 'Price + Shipping: lowest first'], ['high', 'Price + Shipping: highest first'], ['new', 'Time: newly listed']].map(([v, t]) => `<option value="${v}" ${v === sort ? 'selected' : ''}>${t}</option>`).join('')}
        </select></label>
        <span class="pill">Buying Format: Buy It Now</span><span class="pill">Paid in BSV</span>
      </form>
      <div class="grid" id="items"></div>
      ${pager(page, j.pages, (n) => link({ page: n }))}
      ${s.tagline ? `<section id="about"><h2 class="sec">About</h2><p>${esc(s.tagline)}</p></section>` : ''}`;
    after(j.items.map((x, k) => card(x, k)).join('') || '<div class="empty">No items match.</div>', items);
    root.querySelector('[data-share]').onclick = () => (navigator.share ? navigator.share({ title: s.display_name, url: location.href }) : navigator.clipboard?.writeText(location.href).then(() => BMX.alertBar('Link copied.')));
    root.querySelectorAll('[data-soon2]').forEach((b) => (b.onclick = (e) => { e.preventDefault(); BMX.alertBar('Coming soon.'); }));
  } catch (e) {
    if (e.status !== 404 || !/^[a-z0-9._-]{2,64}$/i.test(handle)) { root.innerHTML = `<div class="empty">${esc(e.message)}</div>`; return; }
    // Unclaimed: show only the name from the address. Nothing from the eBay store is shown until its owner claims it.
    const h = esc(handle.toLowerCase()), claim = `/sell?store=${encodeURIComponent(handle.toLowerCase())}`;
    document.title = `Claim ${handle} | bMarketX`;
    root.innerHTML = `<section class="claim">
      <div class="claim-av" aria-hidden="true">${esc(handle[0].toUpperCase())}</div>
      <span class="kicker">Unclaimed store</span>
      <h1>bmarketx.com/str/${h}</h1>
      <p>This address is kept for the eBay seller <b>${h}</b>. If that’s you, claim it in about a minute: your listings, prices, stock and feedback come across, and buyers pay you in BSV straight to your wallet.</p>
      <ol class="claim-steps">
        <li><b>Get bWalletX and sign in.</b> It’s free: Chrome, iPhone, Android or <a class="u" href="https://web.bwalletx.com" target="_blank" rel="noopener">web.bwalletx.com</a>. Your wallet is your account; no email, no password.</li>
        <li><b>Bring your listings.</b> Upload the “All active listings” file from eBay Seller Hub.</li>
        <li><b>Your store opens here.</b> Verify it with Sign in with eBay (coming soon) to carry over your feedback.</li>
      </ol>
      <p class="claim-cta"><a class="btn" href="${claim}" id="claimBtn">Sign in to claim</a><a class="btn ghost" href="https://bwalletx.com/get" target="_blank" rel="noopener">Get bWalletX free</a></p>
      <p class="muted" style="font-size:12px">Not on eBay? <a class="u" href="/my#selling">Open a new store</a> with any free address. bMarketX isn’t affiliated with eBay.</p>
    </section>`;
    fetch('/api/bwalletx/session', { credentials: 'same-origin' }).then((r) => r.json()).then((j) => { if (j.identityKey) document.getElementById('claimBtn').textContent = 'Claim this store'; }).catch(() => {});
  }
})();
</script>
</body>
</html>
