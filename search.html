<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search · bMarketX</title>
<meta name="description" content="Search every bMarketX store.">
<meta property="og:title" content="Search · bMarketX">
<meta property="og:description" content="Search every bMarketX store.">
<link rel="icon" href="/brand/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/brand/apple-touch-icon.png">
<meta property="og:image" content="https://bmarketx.com/brand/og.png">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
</head>
<body data-page="search">
<main class="wrap">
  <h2 class="sec" id="h">All listings</h2>
  <div class="grid" id="res"><div class="empty">Loading…</div></div>
</main>
<script src="https://unpkg.com/@bwalletx/connect@0.5.0/dist/bwalletx-connect.global.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<script src="/app.js"></script>
<script src="/bwx.js"></script>
<script>
const qq = BMX.params.get('q') || '';
if (qq) h.textContent = 'Results for "' + qq + '"';
BMX.api('/api/search?q=' + encodeURIComponent(qq)).then((j) => { h.textContent += ' · ' + j.total.toLocaleString() + ' results'; BMX.after(j.items.map(BMX.card).join('') || '<div class="empty">Nothing matched. Try fewer words.</div>', res); })
  .catch((e) => BMX.after('<div class="empty">' + BMX.esc(e.message) + '</div>', res));
</script>
</body>
</html>
